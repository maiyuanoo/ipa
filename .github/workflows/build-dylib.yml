name: build-dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 iOS dylib
        run: |
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          set +e
          clang --target=arm64-apple-ios15.0 \
            -isysroot "$SDKROOT" \
            -miphoneos-version-min=15.0 \
            -fPIC -dynamiclib -fvisibility=hidden \
            -fobjc-arc \
            RussRebuilt.m \
            -framework Foundation -framework UIKit -framework QuartzCore -framework CoreGraphics \
            -Wl,-install_name,@executable_path/Frameworks/iOS·Origin.dylib \
            -o iOS·Origin.dylib > build-dylib.log 2>&1
          BUILD_STATUS=$?
          cat build-dylib.log
          if [ "$BUILD_STATUS" -ne 0 ]; then
            exit "$BUILD_STATUS"
          fi
          file iOS·Origin.dylib
          xcrun lipo -info iOS·Origin.dylib
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-dylib-diagnostics
          path: build-dylib.log
          if-no-files-found: warn
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Origin-arm64
          path: iOS·Origin.dylib
