name: build-dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 iOS dylib
        run: |
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang --target=arm64-apple-ios15.0 \
            -isysroot "$SDKROOT" \
            -miphoneos-version-min=15.0 \
            -fPIC -dynamiclib -fvisibility=hidden \
            -fobjc-arc \
            RussRebuilt.m \
            -framework Foundation -framework UIKit \
            -Wl,-install_name,@rpath/RussRebuilt.dylib \
            -o RussRebuilt.dylib
          file RussRebuilt.dylib
          xcrun lipo -info RussRebuilt.dylib
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: RussRebuilt-arm64
          path: RussRebuilt.dylib
