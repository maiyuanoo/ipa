name: recover-native-source

on:
  workflow_dispatch:
  push:
    paths:
      - analysis/input/RussOriginal.dylib
      - analysis/input/Ciyue0818.dylib
      - tools/ghidra/RecoverNative.java
      - .github/workflows/recover-native.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Ghidra
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/ghidra.zip"
          curl --fail --location --retry 3 --output "$ARCHIVE_PATH" \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          echo "93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54  $ARCHIVE_PATH" | shasum -a 256 -c -
          unzip -q "$ARCHIVE_PATH" -d "$RUNNER_TEMP/ghidra"
      - name: Locate Ghidra headless analyzer
        run: |
          ANALYZER_PATH="$(find "$RUNNER_TEMP/ghidra" -type f -name analyzeHeadless -print -quit)"
          test -n "$ANALYZER_PATH"
          echo "ANALYZER_PATH=$ANALYZER_PATH" >> "$GITHUB_ENV"
      - name: Recover native helper pseudocode
        run: |
          mkdir -p analysis-output "$RUNNER_TEMP/ghidra-project"
          set +e
          "$ANALYZER_PATH" "$RUNNER_TEMP/ghidra-project" RussRecovery \
            -import analysis/input/RussOriginal.dylib \
            -processor AARCH64:LE:64:v8A \
            -scriptPath tools/ghidra \
            -postScript RecoverNative.java analysis-output/RussNativeRecovered.c \
            -deleteProject > analysis-output/russ-ghidra.log 2>&1
          RUSS_STATUS=$?
          "$ANALYZER_PATH" "$RUNNER_TEMP/ghidra-project" CiyueRecovery \
            -import analysis/input/Ciyue0818.dylib \
            -processor AARCH64:LE:64:v8A \
            -scriptPath tools/ghidra \
            -postScript RecoverNative.java analysis-output/CiyueNativeRecovered.c \
            -deleteProject > analysis-output/ciyue-ghidra.log 2>&1
          CIYUE_STATUS=$?
          printf '%s\n%s\n' "$RUSS_STATUS" "$CIYUE_STATUS" > analysis-output/ghidra.exit-code
          cat analysis-output/russ-ghidra.log
          cat analysis-output/ciyue-ghidra.log
          exit 0
      - name: Publish recovery report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis-output
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: update recovered native source"
          git push origin HEAD:main
