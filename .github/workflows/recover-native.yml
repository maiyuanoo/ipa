name: recover-native-source

on:
  workflow_dispatch:
  push:
    paths:
      - analysis/input/RussOriginal.dylib
      - tools/ghidra/RecoverNative.java
      - .github/workflows/recover-native.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Ghidra
        run: brew install --cask ghidra
      - name: Locate Ghidra headless analyzer
        run: |
          ANALYZER_PATH="$(find /Applications -type f -name analyzeHeadless -print -quit)"
          test -n "$ANALYZER_PATH"
          echo "ANALYZER_PATH=$ANALYZER_PATH" >> "$GITHUB_ENV"
      - name: Recover native helper pseudocode
        run: |
          mkdir -p analysis-output
          "$ANALYZER_PATH" "$RUNNER_TEMP/ghidra-project" RussRecovery \
            -import analysis/input/RussOriginal.dylib \
            -processor AARCH64:LE:64:v8A \
            -scriptPath tools/ghidra \
            -postScript RecoverNative.java analysis-output/RussNativeRecovered.c \
            -deleteProject
      - name: Publish recovery report
        run: |
          test -s analysis-output/RussNativeRecovered.c
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis-output/RussNativeRecovered.c
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: update recovered native source"
          git push origin HEAD:main
