name: recover-native-source

on:
  workflow_dispatch:
  push:
    paths:
      - analysis/input/RussOriginal.dylib
      - analysis/input/Ciyue0818.dylib
      - analysis/input/GD.dylib
      - tools/ghidra/RecoverNative.java
      - .github/workflows/recover-native.yml

permissions:
  contents: write

jobs:
  verify-macos-layout:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Verify Ciyue arm64 Mach-O address layout
        run: |
          set -euo pipefail
          INPUT="analysis/input/Ciyue0818.dylib"
          test -f "$INPUT"
          mkdir -p analysis-output
          {
            echo "sha256:"
            shasum -a 256 "$INPUT"
            echo
            echo "file:"
            file "$INPUT"
            echo
            echo "load commands:"
            xcrun otool -arch arm64 -l "$INPUT"
            echo
            echo "symbols:"
            xcrun nm -arch arm64 -m "$INPUT" || true
          } > analysis-output/ciyue-macos-address-layout.txt
      - name: Verify Jelly arm64 Mach-O address layout
        run: |
          set -euo pipefail
          INPUT="analysis/input/GD.dylib"
          test -f "$INPUT"
          mkdir -p analysis-output
          {
            echo "sha256:"
            shasum -a 256 "$INPUT"
            echo
            echo "file:"
            file "$INPUT"
            echo
            echo "load commands:"
            xcrun otool -arch arm64 -l "$INPUT"
            echo
            echo "symbols:"
            xcrun nm -arch arm64 -m "$INPUT" || true
          } > analysis-output/jelly-macos-address-layout.txt
      - name: Upload macOS address layouts
        uses: actions/upload-artifact@v4
        with:
          name: drawing-macos-address-layouts
          path: |
            analysis-output/ciyue-macos-address-layout.txt
            analysis-output/jelly-macos-address-layout.txt
      - name: Publish macOS address layouts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis-output/ciyue-macos-address-layout.txt analysis-output/jelly-macos-address-layout.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: 更新 macOS 地址布局报告"
          git push origin HEAD:main
  recover:
    needs: verify-macos-layout
    # GitHub macOS runner 无法加载 Ghidra 12.1.3 反编译器；恢复使用已验证的 Linux 环境。
    # 正式 arm64 dylib 的编译和二进制比对仍在 macOS 工作流执行。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Download Ghidra
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/ghidra.zip"
          curl --fail --location --retry 3 --output "$ARCHIVE_PATH" \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          echo "93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54  $ARCHIVE_PATH" | shasum -a 256 -c -
          unzip -q "$ARCHIVE_PATH" -d "$RUNNER_TEMP/ghidra"
      - name: Locate Ghidra headless analyzer
        run: |
          ANALYZER_PATH="$(find "$RUNNER_TEMP/ghidra" -type f -name analyzeHeadless -print -quit)"
          test -n "$ANALYZER_PATH"
          echo "ANALYZER_PATH=$ANALYZER_PATH" >> "$GITHUB_ENV"
      - name: Recover native helper pseudocode
        run: |
          mkdir -p analysis-output "$RUNNER_TEMP/ghidra-project"
          set +e
          "$ANALYZER_PATH" "$RUNNER_TEMP/ghidra-project" CiyueDrawingRecovery \
            -import analysis/input/Ciyue0818.dylib \
            -processor AARCH64:LE:64:v8A \
            -scriptPath tools/ghidra \
            -postScript RecoverNative.java analysis-output/CiyueDrawingRecovered.c drawing \
            -deleteProject > analysis-output/ciyue-drawing-ghidra.log 2>&1
          CIYUE_DRAWING_STATUS=$?
          printf '%s\n' "$CIYUE_DRAWING_STATUS" > analysis-output/ciyue-drawing-ghidra.exit-code
          cat analysis-output/ciyue-drawing-ghidra.log
          exit 0
      - name: Recover Jelly drawing pseudocode
        run: |
          mkdir -p analysis-output "$RUNNER_TEMP/ghidra-project"
          set +e
          "$ANALYZER_PATH" "$RUNNER_TEMP/ghidra-project" JellyDrawingRecovery \
            -import analysis/input/GD.dylib \
            -processor AARCH64:LE:64:v8A \
            -scriptPath tools/ghidra \
            -postScript RecoverNative.java analysis-output/JellyDrawingRecovered.c jelly \
            -deleteProject > analysis-output/jelly-drawing-ghidra.log 2>&1
          JELLY_DRAWING_STATUS=$?
          printf '%s\n' "$JELLY_DRAWING_STATUS" > analysis-output/jelly-drawing-ghidra.exit-code
          cat analysis-output/jelly-drawing-ghidra.log
          exit 0
      - name: Publish recovery report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis-output
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: update recovered native source"
          git pull --rebase origin main
          git push origin HEAD:main
